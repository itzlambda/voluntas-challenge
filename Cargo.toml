[package]
name = "engineering-challenge"
version = "0.1.0"
edition = "2024"
build = "src/util/build.rs"

[dependencies]
anyhow = "1"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
crossbeam = "0.8.4"
fastrand = "2.5.0"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
prometheus = { version = "0.14", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "gzip"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "logging", "tls12"] }
serde = { version = "1", features = ["derive", "rc"] }
# Unknown event values may contain numbers outside f64's range; they stay ignorable.
serde_json = { version = "1.0.154", features = ["raw_value", "arbitrary_precision"] }
tempfile = "3"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "time", "macros", "signal", "net"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7.20", features = ["rt", "time"] }

[build-dependencies]
ergo-sbe = "=0.1.16"
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.9"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["test-util"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
