<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Markets - Voluntas demo</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/site.css">
<script src="/status.js" defer></script>
<script src="/deployment.js" defer></script>
<script src="/book-view.js" defer></script>
<script src="/markets.js" defer></script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div class="deployment-banner" id="deployment-banner" role="status" hidden><span class="deployment-banner-text"></span><a class="deployment-banner-link" target="_blank" rel="noopener noreferrer" hidden></a></div>
<header class="site-header">
  <a class="site-name" href="/">Voluntas demo</a>
  <nav class="site-nav" aria-label="Pages">
    <a href="/">Overview</a>
    <a href="/live">Live</a>
    <a href="/sockets">Sockets</a>
    <a href="/markets" aria-current="page">Markets</a>
  </nav>
  <p class="status" id="status" role="status"><span class="status-dot" aria-hidden="true"></span><span class="status-text">Connecting</span></p>
</header>
<main id="main">
  <div class="page-head">
    <h1>Markets</h1>
    <p class="section-lead">Live order books from the collector's stream. Market details come from Polymarket.</p>
  </div>
  <section class="markets-page" id="markets" aria-label="Markets and order books">
    <div class="market-search">
      <span class="market-search-icon" aria-hidden="true">&#x2315;</span>
      <input type="search" placeholder="Search any Polymarket market" aria-label="Search Polymarket markets" autocomplete="off" spellcheck="false" data-markets-search>
      <button type="button" class="dialog-close" aria-label="Clear search" data-markets-clear hidden>&times;</button>
    </div>
    <div class="socket-columns">
      <section class="dialog-box" aria-labelledby="markets-heading">
        <div class="box-head"><h2 id="markets-heading" data-markets-heading>Top 10 by 24h volume</h2></div>
        <p class="small muted" data-markets-status role="status"></p>
        <div class="market-list" data-markets-list></div>
      </section>
      <section class="dialog-box book-detail" data-book-detail aria-label="Order book">
        <p class="small muted book-empty" data-book-empty>Select a market to watch its live order book.</p>
        <div data-book-body hidden>
          <div class="book-head"><span class="book-icon" data-book-icon></span><h3 data-book-title></h3></div>
          <p class="small muted book-event" data-book-event hidden></p>
          <div class="outcome-toggle" role="group" aria-label="Outcome" data-book-outcomes></div>
          <p class="small book-status" data-book-status role="status"></p>
          <div class="ladder" data-book-ladder></div>
          <p class="small muted" data-book-meta></p>
        </div>
      </section>
    </div>
  </section>
</main>

</footer>
</body>
</html>
