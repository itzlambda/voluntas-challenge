global:
  scrape_interval: 1s
  scrape_timeout: 900ms
scrape_configs:
  - job_name: collector
    static_configs:
      - targets: ['127.0.0.1:9090']
  - job_name: collector_sockets
    metrics_path: /metrics/sockets
    scrape_interval: 15s
    scrape_timeout: 3s
    static_configs:
      - targets: ['127.0.0.1:9090']
